site_name: MongoMig
site_description: Alembic-style schema evolution and migrations for MongoDB.
site_url: https://anon-000.github.io/mongomig/
repo_url: https://github.com/anon-000/mongomig
repo_name: anon-000/mongomig
edit_uri: edit/main/docs/
copyright: MongoMig is MIT licensed

# docs/README.md is the index when browsing docs/ on GitHub; the site uses index.md.
exclude_docs: |
  README.md

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Coming from Alembic or scripts: comparison.md
  - Recipes:
      - recipes/index.md
      - Add a field: recipes/add-a-field.md
      - Rename a field: recipes/rename-a-field.md
      - Change a field's type: recipes/change-a-type.md
      - Remove a field: recipes/remove-a-field.md
      - Add a unique index: recipes/unique-index.md
      - Long custom data migration: recipes/long-data-migration.md
      - Adopt an existing database: recipes/adopt-existing-database.md
      - Two developers changed models: recipes/parallel-branches.md
      - Squash old history: recipes/squash.md
      - Deploy (CI, Docker, Kubernetes): recipes/deploy.md
      - FastAPI: recipes/fastapi.md
      - Test your migrations: recipes/testing.md
      - A migration failed halfway: recipes/resume-after-failure.md
      - Roll back a bad release: recipes/rollback.md
      - Monitor drift nightly: recipes/drift-monitoring.md
  - Guides:
      - Concepts: concepts.md
      - Writing migrations: writing-migrations.md
      - Autogenerate: autogenerate.md
      - Production guide: production.md
  - Reference:
      - CLI: cli.md
      - Python API: python-api.md
      - Troubleshooting: troubleshooting.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details

# `mkdocs build --strict` (CI) turns these into errors: no broken links or anchors ship.
validation:
  omitted_files: warn
  absolute_links: info
  unrecognized_links: warn
  anchors: warn
