[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mongomig"
dynamic = ["version"]
description = "Alembic-style schema evolution and migrations for MongoDB."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "aurosmruti" }]
keywords = ["mongodb", "migrations", "schema", "alembic", "fastapi", "pydantic", "pymongo"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = [
    "pymongo>=4.6",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
beanie = ["beanie>=1.26"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[project.scripts]
mongomig = "mongomig.cli.app:main"

[project.urls]
Homepage = "https://github.com/anon-000/mongomig"
Issues = "https://github.com/anon-000/mongomig/issues"

[tool.hatch.version]
path = "src/mongomig/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mongomig"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a running MongoDB (see docker-compose.yml)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PT"]
ignore = [
    "PLR0913", # CLI commands naturally take many options
    "PLR0917", # ...as positional parameters (Typer signatures)
    "PLR2004", # magic values are fine in tests and small helpers
    "PLC0415", # imports inside functions are deliberate (lazy loading for CLI startup)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0915", "PLR0912"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
